<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      window.addEventListener('error', function(e) {
        console.error('GLOBAL_ERROR_CAPTURED:', e.error || e.message);
        var r = document.getElementById('root');
        if (r && (!r.childNodes || r.childNodes.length === 0)) {
          r.innerHTML = '<div style="padding:24px;background:#fef2f2;border:1px solid #fecaca;margin:20px;border-radius:10px;font-family:sans-serif"><h3 style="color:#dc2626;margin:0 0 8px">Runtime Error Caught</h3><pre style="color:#991b1b;white-space:pre-wrap;font-size:12px">' + (e.error ? (e.error.stack || e.error.message) : e.message) + '</pre></div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('GLOBAL_REJECTION_CAPTURED:', e.reason);
      });
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Placement Drive Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
