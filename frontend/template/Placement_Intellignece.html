<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>InstiPortal · Placement Intelligence</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* =========================================================
   INSTIPORTAL DESIGN SYSTEM
   Matched to Placement Drive Data Capture page
   ========================================================= */

:root{
  --primary:#2563eb;
  --primary-dark:#1d4ed8;
  --primary-soft:#eff6ff;

  --navy:#172554;
  --navy-2:#1e3a8a;

  --text:#1e293b;
  --text-2:#334155;
  --muted:#64748b;
  --muted-2:#94a3b8;

  --border:#dbe5f1;
  --border-soft:#edf2f7;

  --background:#f5f8fc;
  --panel:#ffffff;
  --panel-soft:#fbfdff;

  --success:#16a34a;
  --success-soft:#ecfdf3;

  --warning:#d97706;
  --warning-soft:#fff7ed;

  --danger:#dc2626;
  --danger-soft:#fef2f2;

  --purple:#7c3aed;
  --purple-soft:#f5f3ff;

  --cyan:#0891b2;
  --cyan-soft:#ecfeff;

  --shadow:0 8px 28px rgba(15,23,42,.08);
  --shadow-small:0 2px 8px rgba(15,23,42,.06);
}


*{
  box-sizing:border-box;
}


html,
body{
  width:100%;
  height:100%;
  margin:0;
}


body{
  color:var(--text);
  background:var(--background);
  font-family:Inter,Segoe UI,Arial,sans-serif;
  font-size:14px;
  overflow:hidden;
}


button,
input,
select,
textarea{
  font:inherit;
}


button{
  cursor:pointer;
}


/* =========================================================
   HEADER
   ========================================================= */

.app-header{
  height:66px;
  padding:0 20px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  color:white;

  background:
    linear-gradient(
      115deg,
      #172554,
      #1d4ed8
    );

  box-shadow:
    0 3px 14px
    rgba(30,64,175,.18);
}


.brand{
  display:flex;
  align-items:center;
  gap:12px;
}


.brand-logo{
  width:40px;
  height:40px;

  display:grid;
  place-items:center;

  border-radius:12px;

  background:
    rgba(255,255,255,.17);

  border:
    1px solid
    rgba(255,255,255,.25);

  font-weight:850;
}


.brand-title{
  font-size:18px;
  font-weight:800;
}


.brand-subtitle{
  margin-top:2px;
  font-size:11px;
  opacity:.76;
}


.header-actions{
  display:flex;
  align-items:center;
  gap:9px;
}


.header-button{
  padding:9px 13px;

  color:white;

  border:
    1px solid
    rgba(255,255,255,.25);

  border-radius:9px;

  background:
    rgba(255,255,255,.11);
}


.user-avatar{
  width:37px;
  height:37px;

  display:grid;
  place-items:center;

  border-radius:50%;

  color:var(--primary);
  background:white;

  font-weight:850;
}


/* =========================================================
   GLOBAL MODULE NAVIGATION
   ========================================================= */

.mode-bar{
  min-height:58px;
  padding:9px 20px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:15px;

  background:white;
  border-bottom:1px solid var(--border);
}


.mode-tabs{
  padding:4px;

  display:flex;
  gap:4px;

  border-radius:10px;
  background:#f1f5f9;
}


.mode-tab{
  padding:8px 14px;

  color:var(--muted);

  border:0;
  border-radius:8px;

  background:transparent;

  font-weight:700;
}


.mode-tab.active{
  color:var(--primary);
  background:white;

  box-shadow:
    0 2px 7px
    rgba(15,23,42,.09);
}


.page-context{
  color:var(--muted);
  font-size:12px;
}


/* =========================================================
   MAIN LAYOUT
   ========================================================= */

.layout{
  height:calc(100vh - 124px);

  display:grid;

  grid-template-columns:
    300px
    minmax(700px,1fr)
    390px;

  overflow:hidden;
}


.left-panel,
.middle-panel,
.right-panel{
  min-height:0;
}


.left-panel{
  display:flex;
  flex-direction:column;

  background:#fbfdff;

  border-right:
    1px solid
    var(--border);
}


.middle-panel{
  display:flex;
  flex-direction:column;

  background:var(--background);
}


.right-panel{
  display:flex;
  flex-direction:column;

  background:white;

  border-left:
    1px solid
    var(--border);
}


/* =========================================================
   LEFT PANEL
   ========================================================= */

.left-top{
  padding:15px 15px 11px;
}


.analysis-label{
  margin-bottom:8px;

  color:#64748b;

  font-size:10px;
  font-weight:850;

  letter-spacing:.45px;
  text-transform:uppercase;
}


/* =========================================================
   ANALYSIS VIEW SELECTOR
   ========================================================= */

.analysis-tabs{
  margin-bottom:13px;

  display:grid;
  grid-template-columns:1fr 1fr;

  gap:6px;
}


.analysis-tab{
  min-height:58px;
  padding:9px 10px;

  text-align:left;

  color:#526177;

  border:1px solid var(--border);
  border-radius:9px;

  background:white;

  transition:.16s;
}


.analysis-tab:hover{
  border-color:#93c5fd;
  transform:translateY(-1px);
}


.analysis-tab.active{
  color:var(--primary);

  border-color:#60a5fa;

  background:var(--primary-soft);

  box-shadow:
    inset 3px 0
    var(--primary);
}


.analysis-tab-title{
  font-size:10px;
  font-weight:800;
}


.analysis-tab-sub{
  margin-top:4px;

  color:#7b8ba1;

  font-size:8px;
  line-height:1.3;
}


.analysis-tab.active .analysis-tab-sub{
  color:#4f6e9c;
}


/* =========================================================
   SEARCH
   ========================================================= */

.search-box{
  position:relative;
}


.search-box span{
  position:absolute;

  top:10px;
  left:11px;

  color:#94a3b8;
}


.search-box input{
  width:100%;

  padding:
    10px
    10px
    10px
    34px;

  border:
    1px solid
    var(--border);

  border-radius:9px;

  outline:none;

  background:white;
}


input:focus,
select:focus,
textarea:focus{
  border-color:#93c5fd!important;

  box-shadow:
    0 0 0 3px
    #dbeafe;

  outline:none;
}


/* =========================================================
   LEFT SEGMENT FILTER
   ========================================================= */

.filter-tabs{
  margin:12px 0;

  padding:4px;

  display:grid;
  grid-template-columns:repeat(3,1fr);

  gap:3px;

  border-radius:9px;

  background:#eef2f7;
}


.filter-tab{
  padding:7px 3px;

  color:#64748b;

  border:0;
  border-radius:7px;

  background:transparent;

  font-size:10px;
  font-weight:750;
}


.filter-tab.active{
  color:var(--primary);
  background:white;

  box-shadow:
    0 2px 6px
    rgba(15,23,42,.07);
}


/* =========================================================
   LEFT CONTENT
   ========================================================= */

.left-scroll{
  flex:1;
  min-height:0;

  overflow-y:auto;

  padding:
    0
    15px
    18px;
}


.group-label{
  margin:
    15px
    0
    7px;

  color:#64748b;

  font-size:10px;
  font-weight:850;

  letter-spacing:.5px;
  text-transform:uppercase;
}


.left-card{
  width:100%;

  margin-bottom:8px;
  padding:11px;

  text-align:left;

  border:
    1px solid
    var(--border);

  border-radius:10px;

  background:white;

  cursor:pointer;

  transition:.16s;
}


.left-card:hover{
  border-color:#93c5fd;
  transform:translateY(-1px);
}


.left-card.active{
  border-color:#60a5fa;

  background:var(--primary-soft);

  box-shadow:
    inset 3px 0
    var(--primary);
}


.left-card-top{
  display:flex;

  align-items:flex-start;
  justify-content:space-between;

  gap:7px;
}


.left-card-title{
  color:#25344a;

  font-size:12px;
  font-weight:800;
}


.left-card-sub{
  margin-top:4px;

  color:var(--muted);

  font-size:10px;
  line-height:1.35;
}


.left-card-meta{
  margin-top:9px;

  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:8px;

  color:#64748b;

  font-size:9px;
}


/* =========================================================
   BADGES
   ========================================================= */

.status-badge{
  padding:5px 7px;

  display:inline-block;

  border-radius:20px;

  white-space:nowrap;

  font-size:9px;
  font-weight:850;
}


.badge-progress{
  color:#1d4ed8;
  background:#dbeafe;
}


.badge-awaiting{
  color:#b45309;
  background:#fef3c7;
}


.badge-completed{
  color:#15803d;
  background:#dcfce7;
}


.badge-scheduled{
  color:#6d28d9;
  background:#ede9fe;
}


.badge-danger{
  color:#b91c1c;
  background:#fee2e2;
}


.badge-draft{
  color:#475569;
  background:#e2e8f0;
}


.badge-cyan{
  color:#0e7490;
  background:#cffafe;
}


/* =========================================================
   MIDDLE HEADER
   ========================================================= */

.middle-header{
  padding:
    18px
    19px
    12px;
}


.top-row{
  display:flex;

  align-items:flex-start;
  justify-content:space-between;

  gap:15px;
}


.page-title{
  margin:0;

  color:var(--navy);

  font-size:21px;
  font-weight:800;
}


.page-subtitle{
  margin:5px 0 0;

  color:var(--muted);

  font-size:11px;
  line-height:1.45;
}


.top-actions{
  display:flex;
  gap:7px;
}


/* =========================================================
   BUTTONS
   ========================================================= */

.primary-button,
.secondary-button,
.danger-button{
  padding:9px 13px;

  border-radius:9px;

  font-weight:750;
}


.primary-button{
  color:white;

  border:
    1px solid
    var(--primary);

  background:var(--primary);
}


.primary-button:hover{
  background:var(--primary-dark);
}


.secondary-button{
  color:#475569;

  border:
    1px solid
    var(--border);

  background:white;
}


.danger-button{
  color:white;

  border:
    1px solid
    var(--danger);

  background:var(--danger);
}


.small-button{
  padding:7px 9px;

  color:#475569;

  border:
    1px solid
    var(--border);

  border-radius:7px;

  background:white;

  font-size:10px;
  font-weight:700;
}


.small-button.blue{
  color:var(--primary);

  border-color:#bfdbfe;

  background:var(--primary-soft);
}


/* =========================================================
   TOP FILTER BAR
   ========================================================= */

.filter-bar{
  padding:
    0
    19px
    12px;

  display:flex;
  align-items:center;
  gap:8px;

  flex-wrap:wrap;
}


.filter-group{
  display:flex;
  align-items:center;
  gap:5px;
}


.filter-label{
  color:#64748b;

  font-size:9px;
  font-weight:800;
}


.filter-control{
  height:34px;

  padding:0 9px;

  color:#475569;

  border:
    1px solid
    var(--border);

  border-radius:8px;

  background:white;

  font-size:10px;
}


.filter-spacer{
  flex:1;
}


/* =========================================================
   INFO BANNER / SIGNAL BAR
   ========================================================= */

.info-banner{
  margin:
    0
    19px
    13px;

  padding:
    10px
    12px;

  display:flex;
  align-items:center;

  gap:18px;

  flex-wrap:wrap;

  color:#1e40af;

  border:
    1px solid
    #bfdbfe;

  border-radius:9px;

  background:var(--primary-soft);

  font-size:10px;
}


.signal-item{
  display:flex;
  align-items:center;
  gap:6px;
}


.signal-dot{
  width:8px;
  height:8px;

  border-radius:50%;
}


.signal-number{
  color:var(--navy);

  font-weight:850;
}


/* =========================================================
   MIDDLE SCROLL
   ========================================================= */

.middle-scroll{
  flex:1;
  min-height:0;

  overflow:auto;

  padding:
    0
    19px
    24px;
}


/* =========================================================
   SECTION
   ========================================================= */

.section{
  margin-bottom:19px;
}


.section-header{
  margin-bottom:9px;

  display:flex;

  align-items:flex-end;
  justify-content:space-between;

  gap:10px;
}


.section-title{
  color:#334155;

  font-size:13px;
  font-weight:850;
}


.section-subtitle{
  margin-top:3px;

  color:var(--muted);

  font-size:10px;
}


.section-meta{
  color:#64748b;

  font-size:9px;
}


/* =========================================================
   TABLES
   ========================================================= */

.table-card{
  overflow:auto;

  border:
    1px solid
    var(--border);

  border-radius:11px;

  background:white;

  box-shadow:
    0 2px 9px
    rgba(15,23,42,.035);
}


.data-table{
  width:100%;

  min-width:1050px;

  border-collapse:collapse;
}


.data-table th{
  padding:
    10px
    10px;

  color:#64748b;

  background:#f8fafc;

  border-bottom:
    1px solid
    var(--border);

  text-align:left;

  font-size:9px;
  font-weight:850;

  letter-spacing:.35px;

  text-transform:uppercase;
}


.data-table th.center,
.data-table td.center{
  text-align:center;
}


.data-table td{
  padding:
    11px
    10px;

  border-bottom:
    1px solid
    #edf2f7;

  color:#475569;

  font-size:10px;
}


.data-table tr:last-child td{
  border-bottom:0;
}


.data-table tbody tr:hover td{
  background:#fbfdff;
}


.click-cell{
  color:var(--primary)!important;

  font-weight:850;

  cursor:pointer;
}


.click-cell:hover{
  background:#eff6ff!important;

  text-decoration:underline;
}


/* =========================================================
   STUDENT IDENTITY
   ========================================================= */

.student-identity{
  display:flex;
  align-items:center;
  gap:8px;
}


.mini-avatar{
  width:32px;
  height:32px;

  flex:none;

  display:grid;
  place-items:center;

  color:var(--primary);

  border-radius:8px;

  background:#dbeafe;

  font-size:9px;
  font-weight:850;
}


.student-name{
  color:#27364a;

  font-weight:800;
}


.student-meta{
  margin-top:2px;

  color:#94a3b8;

  font-size:8px;
}


/* =========================================================
   INDUSTRY MATRIX
   ========================================================= */

.metric-name{
  color:#334155;

  font-size:10px;
  font-weight:800;
}


.metric-description{
  margin-top:4px;

  color:#94a3b8;

  font-size:8px;
  line-height:1.4;
}


/* =========================================================
   YEAR / DRIVE SECTIONS
   ========================================================= */

.year-section{
  margin-bottom:16px;
}


.year-header{
  padding:
    11px
    13px;

  display:flex;
  justify-content:space-between;

  border:
    1px solid
    var(--border);

  border-radius:
    11px
    11px
    0
    0;

  background:#f8fafc;
}


.year-title{
  color:#334155;

  font-size:12px;
  font-weight:850;
}


.year-meta{
  color:#64748b;

  font-size:9px;
}


.drive-process-card{
  padding:13px;

  border:
    1px solid
    var(--border);

  border-top:0;

  background:white;
}


.drive-process-card:last-child{
  border-radius:
    0
    0
    11px
    11px;
}


.drive-process-top{
  display:flex;

  justify-content:space-between;

  gap:10px;
}


.drive-process-title{
  color:#263449;

  font-size:13px;
  font-weight:850;
}


.drive-process-meta{
  margin-top:4px;

  color:var(--muted);

  font-size:10px;
}


/* =========================================================
   RECRUITMENT PIPELINE
   ========================================================= */

.pipeline{
  margin-top:13px;

  display:grid;

  grid-template-columns:
    repeat(6,1fr);

  gap:7px;
}


.stage-box{
  min-height:76px;

  padding:9px;

  position:relative;

  border:
    1px solid
    var(--border);

  border-radius:10px;

  background:#fbfdff;

  cursor:pointer;
}


.stage-box:hover{
  border-color:#93c5fd;
}


.stage-box.active{
  border-color:var(--primary);

  background:var(--primary-soft);

  box-shadow:
    inset 0 0 0 1px
    #93c5fd;
}


.stage-number{
  width:22px;
  height:22px;

  display:grid;
  place-items:center;

  border-radius:50%;

  color:#64748b;

  background:#e2e8f0;

  font-size:9px;
  font-weight:850;
}


.stage-box.active .stage-number{
  color:white;
  background:var(--primary);
}


.stage-label{
  margin-top:7px;

  color:#334155;

  font-size:9px;
  font-weight:800;
}


.stage-value{
  margin-top:4px;

  color:var(--navy);

  font-size:17px;
  font-weight:850;
}


.stage-foot{
  margin-top:2px;

  color:#94a3b8;

  font-size:7px;
}


/* =========================================================
   RIGHT PANEL
   ========================================================= */

.right-header{
  padding:
    17px
    17px
    14px;

  border-bottom:
    1px solid
    var(--border);
}


.panel-title{
  margin:0;

  color:var(--navy);

  font-size:16px;
  font-weight:850;
}


.panel-description{
  margin:5px 0 0;

  color:var(--muted);

  font-size:11px;
  line-height:1.5;
}


.right-scroll{
  flex:1;
  min-height:0;

  overflow-y:auto;

  padding:16px 17px 22px;
}


.right-section{
  margin-bottom:16px;
}


.right-heading{
  margin-bottom:8px;

  color:#334155;

  font-size:11px;
  font-weight:850;
}


/* =========================================================
   COMPLETION / SUMMARY CARD
   ========================================================= */

.completion-card{
  padding:13px;

  border:
    1px solid
    #bfdbfe;

  border-radius:11px;

  background:
    linear-gradient(
      135deg,
      #eff6ff,
      #f5f3ff
    );
}


.completion-top{
  display:flex;

  align-items:center;
  justify-content:space-between;
}


.completion-label{
  color:#334155;

  font-size:11px;
  font-weight:850;
}


.completion-meta{
  margin-top:3px;

  color:#64748b;

  font-size:9px;
}


.completion-score{
  color:var(--navy);

  font-size:26px;
  font-weight:850;
}


.progress-track{
  height:7px;

  margin-top:9px;

  overflow:hidden;

  border-radius:20px;

  background:#dbe5f1;
}


.progress-fill{
  height:100%;

  border-radius:20px;

  background:
    linear-gradient(
      90deg,
      #2563eb,
      #60a5fa
    );
}


/* =========================================================
   RIGHT DETAIL GRID
   ========================================================= */

.detail-card{
  padding:
    11px;

  border:
    1px solid
    var(--border);

  border-radius:10px;

  background:white;
}


.detail-row{
  padding:
    8px
    0;

  display:grid;

  grid-template-columns:
    125px
    1fr;

  gap:8px;

  border-top:
    1px solid
    var(--border-soft);

  font-size:10px;
}


.detail-row:first-child{
  border-top:0;
}


.detail-label{
  color:#64748b;
}


.detail-value{
  color:#334155;

  font-weight:700;
}


/* =========================================================
   ALERT BOXES
   ========================================================= */

.warning-box,
.success-box,
.info-box,
.danger-box{
  padding:11px;

  border-radius:9px;

  font-size:10px;
  line-height:1.5;
}


.warning-box{
  color:#92400e;

  border:
    1px solid
    #fed7aa;

  background:var(--warning-soft);
}


.success-box{
  color:#166534;

  border:
    1px solid
    #bbf7d0;

  background:var(--success-soft);
}


.info-box{
  color:#1e40af;

  border:
    1px solid
    #bfdbfe;

  background:var(--primary-soft);
}


.danger-box{
  color:#991b1b;

  border:
    1px solid
    #fecaca;

  background:var(--danger-soft);
}


/* =========================================================
   RIGHT MINI STATS
   ========================================================= */

.mini-stat-grid{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:7px;
}


.mini-stat{
  padding:
    10px
    6px;

  text-align:center;

  border:
    1px solid
    var(--border);

  border-radius:9px;

  background:#fbfdff;
}


.mini-stat strong{
  display:block;

  color:var(--navy);

  font-size:18px;
}


.mini-stat span{
  color:#64748b;

  font-size:8px;
}


/* =========================================================
   PERSON / RECRUITER CARDS
   ========================================================= */

.person-card{
  margin-bottom:7px;

  padding:10px;

  display:grid;

  grid-template-columns:
    34px
    1fr
    auto;

  gap:8px;

  align-items:center;

  border:
    1px solid
    var(--border);

  border-radius:9px;

  background:white;

  cursor:pointer;
}


.person-card:hover{
  border-color:#93c5fd;
  background:#fbfdff;
}


.person-icon{
  width:34px;
  height:34px;

  display:grid;
  place-items:center;

  color:var(--primary);

  border-radius:8px;

  background:#dbeafe;

  font-size:8px;
  font-weight:850;
}


.person-title{
  color:#334155;

  font-size:10px;
  font-weight:800;
}


.person-subtitle{
  margin-top:3px;

  color:#94a3b8;

  font-size:8px;
}


.person-side{
  text-align:right;
}


.person-package{
  color:#15803d;

  font-size:10px;
  font-weight:850;
}


/* =========================================================
   TIMELINE
   ========================================================= */

.activity-item{
  position:relative;

  margin-left:7px;

  padding:
    0
    0
    15px
    17px;

  border-left:
    2px solid
    #dbeafe;
}


.activity-item:last-child{
  border-left-color:transparent;
}


.activity-dot{
  position:absolute;

  top:0;
  left:-7px;

  width:12px;
  height:12px;

  border:
    2px solid
    white;

  border-radius:50%;

  background:var(--primary);

  box-shadow:
    0 0 0 1px
    #93c5fd;
}


.activity-dot.green{
  background:var(--success);
}


.activity-dot.red{
  background:var(--danger);
}


.activity-dot.orange{
  background:var(--warning);
}


.activity-title{
  color:#334155;

  font-size:10px;
  font-weight:800;
}


.activity-meta{
  margin-top:3px;

  color:var(--muted);

  font-size:9px;
  line-height:1.4;
}


/* =========================================================
   EMPTY
   ========================================================= */

.empty{
  padding:18px;

  color:#64748b;

  border:
    1px dashed
    var(--border);

  border-radius:9px;

  background:#fbfdff;

  font-size:10px;
  text-align:center;
}


/* =========================================================
   MODAL
   ========================================================= */

.modal-overlay{
  position:fixed;

  inset:0;

  z-index:100;

  padding:25px;

  display:none;

  align-items:center;
  justify-content:center;

  background:
    rgba(15,23,42,.55);
}


.modal-overlay.open{
  display:flex;
}


.modal{
  width:min(760px,96vw);

  max-height:90vh;

  overflow:auto;

  border-radius:15px;

  background:white;

  box-shadow:
    0 25px 70px
    rgba(15,23,42,.3);
}


.modal-header{
  padding:
    17px
    19px;

  display:flex;

  align-items:flex-start;
  justify-content:space-between;

  border-bottom:
    1px solid
    var(--border);
}


.modal-header h2{
  margin:0;

  color:var(--navy);

  font-size:17px;
}


.modal-header p{
  margin:5px 0 0;

  color:var(--muted);

  font-size:10px;
}


.modal-body{
  padding:
    18px
    19px;
}


.modal-footer{
  padding:
    13px
    19px;

  display:flex;
  justify-content:flex-end;

  gap:8px;

  border-top:
    1px solid
    var(--border);
}


.close-button{
  width:32px;
  height:32px;

  color:#64748b;

  border:
    1px solid
    var(--border);

  border-radius:8px;

  background:white;

  font-size:18px;
}


/* =========================================================
   TOAST
   ========================================================= */

.toast{
  position:fixed;

  right:22px;
  bottom:22px;

  z-index:200;

  padding:
    12px
    16px;

  color:white;

  border-radius:10px;

  background:#172554;

  box-shadow:var(--shadow);

  opacity:0;

  transform:
    translateY(12px);

  pointer-events:none;

  transition:.25s;
}


.toast.show{
  opacity:1;

  transform:
    translateY(0);
}

function setView(
  view
){

  currentView =
    view;


  selectedIndustry =
    view==="industries"
    ?
    "__overall__"
    :
    selectedIndustry;


  leftSegment =
    "all";


  document
    .querySelectorAll(
      ".analysis-tab"
    )
    .forEach(
      x=>
        x.classList.remove(
          "active"
        )
    );


  document
    .getElementById(
      "view_"+view
    )
    .classList.add(
      "active"
    );


  document
    .getElementById(
      "leftSearch"
    )
    .value =
      "";


  renderAll();
}

  if(
    leftSegment==="active"

      list.filter(
        x=>
          [
            "Completed",
            "Ongoing",
            "Awaiting Result",
            "Confirmed"
          ].includes(
            x.status
          )
      );
  }


  if(
    leftSegment==="attention"
  ){

    list =
      list.filter(
        x=>
          [
            "Not Confirmed",
            "Not Visiting",
            "Awaiting Result"
          ].includes(
            x.status
          )
      );
  }


  const q =
    document
      .getElementById(
        "leftSearch"

          ||
          x.role
            .toLowerCase()
            .includes(q)
          ||
          x.sector
            .toLowerCase()
            .includes(q)
      );
  }


  return list;
}

function batchSelect(

  let values =
    [
      ["All","All"],
      ["2027","2026–27"],
      ["2026","2025–26"],
      ["2025","2024–25"]
    ];


  if(
    historical
  ){

    values.push(
      ["2024","2023–24"],
      ["2023","2022–23"]
    );

  }


  return `

    <select
      class="filter-control"
      onchange="
        filters.batch=this.value;
        renderMiddle();
      ">

      ${
        values.map(
          x=>`

            <option
              value="${x[0]}"

                filters.batch===x[0]
                ?
                "selected"
                :
                ""
              }>

              ${x[1]}

            </option>
          `
        )
        .join("")
      }

    </select>
  `;
}

function renderSignalBar(){

  let html = "";


  if(
    currentView==="overall"
  ){

    html =
      signal("#2563eb","1,378","offers")
      +
      signal("#16a34a","1,091","unique offer holders")
      +
      signal("#d97706","132","not yet placed")
      +
      signal("#7c3aed","109","higher studies")
      +
      signal("#0891b2","64","entrepreneurship");

  }


  if(
    currentView==="industries"
  ){

    if(
      selectedIndustry==="__overall__"
    ){

      html =
        signal("#2563eb","312","recruiters in database")
        +
        signal("#16a34a","126","visited")
        +
        signal("#7c3aed","151","confirmed")
        +
        signal("#dc2626","41","missed this year")
        +
        signal("#d97706","48","yet to confirm");

    }else{

      const c =
        getIndustry(
          selectedIndustry
        );


      html =
        signal(
          "#2563eb",
          c.relationship,
          "relationship"
        )
        +
        signal(
          "#16a34a",
          currentOffers(c),
          "current-year offers"
        )
        +
        signal(
          "#7c3aed",
          "₹"+maxPackage(c)+"L",
          "highest package"
        )
        +
        signal(
          statusColour(c.status),
          c.status,
          "current status"
        );

    }

  }


  if(
    currentView==="companies"
  ){

    html =
      signal(
        "#16a34a",
        companyStats.filter(
          x=>x.status==="Completed"
        ).length,
        "completed"
      )
      +
      signal(
        "#2563eb",
        companyStats.filter(
          x=>x.status==="Ongoing"
        ).length,
        "ongoing"
      )
      +
      signal(
        "#d97706",
        companyStats.filter(
          x=>x.status==="Awaiting Result"
        ).length,
        "awaiting result"
      )
      +
      signal(
        "#7c3aed",
        companyStats.filter(
          x=>x.status==="Confirmed"
        ).length,
        "future confirmed"
      );

  }


  if(
    currentView==="students"
  ){

    const list =
      filteredStudents();


    html =
      signal(
        "#2563eb",
        list.length,
        "students in view"
      )
      +
      signal(
        "#16a34a",
        list.filter(
          x=>x.outcome==="Placed"
        ).length,
        "placed"
      )
      +
      signal(
        "#d97706",
        list.filter(
          x=>x.outcome==="Not Placed"
        ).length,
        "not placed"
      )
      +
      signal(
        "#dc2626",
        list.filter(
          x=>x.finalMisses>=2
        ).length,
        "repeated final misses"
      )
      +
      signal(
        "#7c3aed",
        list.filter(
          x=>x.offers.length>=2
        ).length,
        "multiple offers"
      );

  }


  document
    .getElementById(
      "signalBar"

function scaled(
  number
){

  if(
    filters.department==="All"
  ){
    return number;
  }


  const factor = {

    "CSE":.27,
    "IT":.15,
    "AI & ML":.11,
    "ECE":.17,
    "EEE":.10,
    "MECH":.13,
    "CIVIL":.07

  }[filters.department] || 1;


  return Math.max(
    0,
    Math.round(
      number*factor
    )
  );
}

function showSalary(
  slab,
  mode,
  batch
){

  const stat =
    batchStats.find(
      x=>x.batch===batch
    );


  const institutionalCount =
    scaled(
      stat[mode][slab]
    );


  let list =
    students.filter(
      s=>s.batch===batch
    );


  if(
    filters.department!=="All"
  ){

    list =
      list.filter(
        s=>s.dept===filters.department
      );
  }


  if(
    mode==="unique"
  ){

    list =
      list.filter(
        s=>
          packageMatches(
            s.bestPackage,
            slab
          )
      );

  }else{

    list =
      list.filter(
        s=>
          s.offers.some(
            offer=>
              packageMatches(
                offer.package,
                slab
              )
          )
      );

  }


  document
    .getElementById(
      "rightHeader"
    )
    .innerHTML = `

      <h2 class="panel-title">
        ${salaryLabel(slab)}
      </h2>

      <p class="panel-description">
        ${
          mode==="unique"
          ?
          "Unique students based on their highest confirmed offer."
          :
          "All confirmed offers within this compensation range."
        }
      </p>
    `;


  document
    .getElementById(
      "rightContent"
    )
    .innerHTML = `

      <div class="right-section">

        <div class="completion-card">

          <div class="completion-top">

            <div>

              <div class="completion-label">
                Institutional Count
              </div>

              <div class="completion-meta">
                Batch ${batch}
              </div>

            </div>

            <div class="completion-score">
              ${institutionalCount}
            </div>

          </div>

        </div>

      </div>


      <div class="right-section">

        <div class="right-heading">
          Students
        </div>

        ${
          list.length
          ?
          list.map(
            s=>personCard(s)
          )
          .join("")
          :
          `

            <div class="empty">
              The prototype contains representative student-level data. The live system would populate all ${institutionalCount} records here.
            </div>
          `
        }

      </div>

    `;

}

function showOutcome(
  type,
  batch
){

  const stat =
    batchStats.find(
      x=>x.batch===batch
    );


  let list =
    students.filter(
      s=>s.batch===batch
    );


  if(
    filters.department!=="All"
  ){

    list =
      list.filter(
        s=>s.dept===filters.department
      );
  }


  let title = "";
  let total = 0;


  if(
    type==="notPlaced"
  ){

    title =
      "Not Yet Placed";

    total =
      scaled(
        stat.notPlaced
      );

    list =
      list.filter(
        x=>x.outcome==="Not Placed"
      );

  }


  if(
    type==="notEligible"
  ){

    title =
      "Not Eligible / Eligibility Restricted";

    total =
      scaled(
        stat.notEligible
      );

    list =
      list.filter(
        x=>
          x.outcome==="Not Eligible"
          ||
          x.outcome==="Eligibility Restricted"
      );

  }


  if(
    type==="higherStudies"
  ){

    title =
      "Higher Studies";

    total =
      scaled(
        stat.higherStudies
      );

    list =
      list.filter(
        x=>x.outcome==="Higher Studies"
      );

  if(
    type==="entrepreneur"

    title =

    total =
      scaled(
        stat.entrepreneur
      );

    list =
      list.filter(
        x=>x.outcome==="Entrepreneurship"

  document
    .getElementById(
      "rightHeader"
    )
    .innerHTML = `

      <h2 class="panel-title">
        ${title}
      </h2>

      <p class="panel-description">
        Batch ${batch} · Click a student for complete evidence and status.

    `;


  document
    .getElementById(
      "rightContent"
    )
    .innerHTML = `

      <div class="right-section">

        <div class="completion-card">

          <div class="completion-top">

            <div>

              <div class="completion-label">
                Students
              </div>

              <div class="completion-meta">

            </div>

function showIndustryMetric(

  const metric =
    industryMatrix.find(
      x=>x.key===key
    );


  let list =
    [...industries];


  if(
    key==="visited"
  ){

    list =
      list.filter(
        x=>
          x.history.some(
            h=>h.year===year
          )
      );

  }


  if(
    key==="confirmed"
  ){

    list =
      list.filter(
        x=>
          [
            "Completed",
            "Ongoing",
            "Awaiting Result",
            "Confirmed"
          ].includes(
            x.status
          )
      );

  }


  if(
    key==="missed"
  ){

    list =
      list.filter(
        x=>x.status==="Not Visiting"
        ||
        x.status==="Not Confirmed"
      );

  }


  if(
    key==="targetPending"
  ){

    list =
      list.filter(
        x=>x.status==="Not Confirmed"
      );

  }


  if(
    key==="equalLast"

    list =
      companyStats
        .filter(
          x=>

            x.offers>=x.lastYear

function renderIndustryCompany(){

  const company =
    getIndustry(
      selectedIndustry
    );


  let history =
    [...company.history];


  if(
    filters.batch!=="All"
  ){

    history =
      history.filter(
        x=>x.year===filters.batch
      );

  }


  if(
    filters.department!=="All"
  ){

    history =
      history.filter(
        x=>
          x.departments.includes(
            filters.department
          )
      );

  }


  const grouped = {};


  history.forEach(
    drive=>{

      if(
        !grouped[drive.year]
      ){
        grouped[drive.year] = [];
      }

      grouped[drive.year].push(
        drive
      );

    }
  );


  let html = "";


  Object
    .keys(
      grouped
    )
    .sort(
      (a,b)=>b-a
    )
    .forEach(
      year=>{

        const drives =
          grouped[year];


        html += `

          <div class="year-section">

            <div class="year-header">

              <div class="year-title">
                Placement Year ${year}
              </div>

              <div class="year-meta">

                ${drives.length}
                recruitment phase${drives.length===1?"":"s"}

                ·

                ${
                  drives.reduce(
                    (sum,x)=>sum+x.offers,
                    0
                  )
                }
                offers

              </div>

            </div>


            ${
              drives.map(
                drive=>
                  renderDriveProcess(
                    company,
                    drive
                  )
              )
              .join("")
            }

          </div>
        `;

      }
    );


  document
    .getElementById(
      "middleContent"
    )
    .innerHTML =

      html
      ||
      `

        <div class="empty">
          No recruitment process matches the current filters.
        </div>
      `;


  renderIndustryRight(
    company
  );

}

function filteredCompanies(){

  let list =
    [...companyStats];


  if(
    filters.sector!=="All"
  ){

    list =
      list.filter(
        x=>x.sector===filters.sector
      );

  }


  if(
    filters.department!=="All"
  ){

    list =
      list.filter(
        x=>
          x.departments.includes(
            filters.department
          )
      );

  }


  if(
    filters.companyStatus!=="All"
  ){

    list =
      list.filter(
        x=>x.status===filters.companyStatus
      );

  }


  const q =
    document
      .getElementById(
        "leftSearch"
      )
      .value
      .trim()
      .toLowerCase();


  if(
    q
  ){

    list =
      list.filter(
        x=>
          x.company
            .toLowerCase()
            .includes(q)
          ||
          x.sector
            .toLowerCase()
            .includes(q)
      );

  }


  if(
    companySort==="offers"
  ){

    list.sort(
      (a,b)=>b.offers-a.offers
    );

  }


  if(
    companySort==="package"
  ){

    list.sort(
      (a,b)=>b.package-a.package
    );

  }


  if(
    companySort==="growth"
  ){

    list.sort(
      (a,b)=>
        (
          b.offers-b.lastYear
        )
        -
        (
          a.offers-a.lastYear
        )
    );

  }


  if(
    companySort==="decline"
  ){

    list.sort(
      (a,b)=>
        (
          a.offers-a.lastYear
        )
        -
        (
          b.offers-b.lastYear
        )
    );

  }


  if(
    companySort==="name"
  ){

    list.sort(
      (a,b)=>
        a.company.localeCompare(
          b.company
        )
    );

  }


  return list;
}

/* =========================================================
   STUDENT FILTERING
   ========================================================= */

function filteredStudents(){

  let list =
    [...students];


  if(
    filters.batch!=="All"
  ){

    list =
      list.filter(
        s=>s.batch===filters.batch
      );

  }


  if(
    filters.department!=="All"
  ){

    list =
      list.filter(
        s=>s.dept===filters.department
      );

  }


  if(
    filters.specialization!=="All"
  ){

    list =
      list.filter(
        s=>s.specialization===filters.specialization
      );

  }


  if(
    filters.studentFocus==="Not Placed"
  ){

    list =
      list.filter(
        s=>s.outcome==="Not Placed"
      );

  }


  if(
    filters.studentFocus==="Low Exposure"
  ){

    list =
      list.filter(
        s=>
          s.appeared<=3
          &&
          ![
            "Higher Studies",
            "Entrepreneurship"
          ].includes(
            s.outcome
          )
      );

  }


  if(
    filters.studentFocus==="High Exposure"
  ){

    list =
      list.filter(
        s=>s.appeared>=7
      );

  }


  if(
    filters.studentFocus==="Final Misses"
  ){

    list =
      list.filter(
        s=>s.finalMisses>=2
      );

  }


  if(
    filters.studentFocus==="Not Honoured"
  ){

    list =
      list.filter(
        s=>s.notHonoured>0
      );

  }


  if(
    filters.studentFocus==="Multiple Offers"
  ){

    list =
      list.filter(
        s=>s.offers.length>=2
      );

  }


  if(
    filters.studentFocus==="Declined Offers"
  ){

    list =
      list.filter(
        s=>
          s.offers.some(
            o=>o.status==="Declined"
          )
      );

  }


  if(
    filters.studentFocus==="Arrears"
  ){

    list =
      list.filter(
        s=>s.arrears>0
      );

  }


  if(
    filters.studentFocus==="Higher Studies"
  ){

    list =
      list.filter(
        s=>s.outcome==="Higher Studies"
      );

  }


  if(
    filters.studentFocus==="Entrepreneurship"
  ){

    list =
      list.filter(
        s=>s.outcome==="Entrepreneurship"
      );

  }


  if(
    studentSort==="intervention"
  ){

    list.sort(
      (a,b)=>
        interventionScore(b)
        -
        interventionScore(a)
    );

  }


  if(
    studentSort==="appeared"
  ){

    list.sort(
      (a,b)=>b.appeared-a.appeared
    );

  }


  if(
    studentSort==="offers"
  ){

    list.sort(
      (a,b)=>
        b.offers.length-
        a.offers.length
    );

  }


  if(
    studentSort==="finalMisses"
  ){

    list.sort(
      (a,b)=>
        b.finalMisses-
        a.finalMisses
    );

  }


  if(
    studentSort==="notHonoured"
  ){

    list.sort(
      (a,b)=>
        b.notHonoured-
        a.notHonoured
    );

  }


  if(
    studentSort==="package"
  ){

    list.sort(
      (a,b)=>
        b.bestPackage-
        a.bestPackage
    );

  }


  if(
    studentSort==="cgpa"
  ){

    list.sort(
      (a,b)=>b.cgpa-a.cgpa
    );

  }


  if(
    studentSort==="name"
  ){

    list.sort(
      (a,b)=>
        a.name.localeCompare(
          b.name
        )
    );

  }


  return list;
}


/* =========================================================
   INTERVENTION SCORE
   ========================================================= */

function interventionScore(
  s
){

  let score = 0;


  if(
    s.outcome==="Not Placed"
  ){
    score += 45;
  }


  score +=
    s.finalMisses*
    12;


  score +=
    s.notHonoured*
    10;


  if(
    s.invitations>=7
    &&
    s.appeared<=3
  ){
    score += 20;
  }


  if(
    s.arrears>0
  ){
    score += 25;
  }


  if(
    s.offers.length>=2
  ){
    score -= 20;
  }


  if(
    [
      "Higher Studies",
      "Entrepreneurship"
    ].includes(
      s.outcome
    )
  ){
    score -= 60;
  }


  return score;
}

function studentAlert(

  if(
    s.finalMisses>=3

    return `

          <strong>
            Conversion intervention required.
          </strong>

          The student has reached ${s.finalMisses} final rounds without securing an offer.

    `;

  }


  if(
    s.notHonoured>=2
  ){

    return `

      <div class="right-section">

        <div class="warning-box">

          <strong>
            Placement discipline requires attention.
          </strong>

          ${s.notHonoured} placement invitations were not honoured.

        </div>

      </div>
    `;

  }


  if(
    s.arrears>0
  ){

    return `

      <div class="right-section">

        <div class="danger-box">

          <strong>
            Eligibility restriction.
          </strong>

          ${s.restriction}

        </div>

      </div>
    `;

  }


  if(
    s.offers.length>=2
  ){

    return `

      <div class="right-section">

        <div class="success-box">

          <strong>
            Multiple placement outcomes.
          </strong>

          The student currently holds ${s.offers.length} offers with a best package of ₹${s.bestPackage} LPA.

        </div>

      </div>
    `;

  }


  return "";
}

/* =========================================================

   ========================================================= */

function initials(
  name
){

  return name
    .split(" ")
    .map(
      x=>x[0]
    )
    .slice(
      0,
      2
    )
    .join("")
    .toUpperCase();

}


function statusBadge(
  status
){

  let cls =
    "badge-draft";


  if(
    status==="Completed"
  ){
    cls =
      "badge-completed";
  }


  if(
    status==="Ongoing"
    ||
    status.includes("Technical")
  ){
    cls =
      "badge-progress";
  }


  if(
    status==="Awaiting Result"
    ||
    status.includes("Awaited")
  ){
    cls =
      "badge-awaiting";
  }


  if(
    status==="Confirmed"
    ||
    status.includes("Confirmed")
  ){
    cls =
      "badge-scheduled";
  }


  if(
    status==="Not Visiting"
  ){
    cls =
      "badge-danger";
  }


  if(
    status==="Not Confirmed"
  ){
    cls =
      "badge-awaiting";
  }


  return `

    <span
      class="
        status-badge
        ${cls}
      ">

      ${status}

    </span>
  `;
}


function studentOutcomeBadge(
  s
){

  if(
    s.outcome==="Placed"
  ){

    return `
      <span class="status-badge badge-completed">
        Placed
      </span>
    `;

  }


  if(
    s.outcome==="Not Placed"
  ){

    return `
      <span class="status-badge badge-awaiting">
        Not Placed
      </span>
    `;

  }


  if(
    s.outcome==="Higher Studies"
  ){

    return `
      <span class="status-badge badge-scheduled">
        Higher Studies
      </span>
    `;

  }


  if(
    s.outcome==="Entrepreneurship"
  ){

    return `
      <span class="status-badge badge-cyan">
        Entrepreneurship
      </span>
    `;

  }


  return `
    <span class="status-badge badge-danger">
      ${s.outcome}
    </span>
  `;

}


function detailRow(

  value
){

  return `

    <div class="detail-row">

      <div class="detail-label">
        ${label}
      </div>

      <div class="detail-value">

      </div>

}


function miniStat(

){

function activityItem(

function journeyColour(
  state
){

  if(
    state==="Selected"
    ||
    state==="Accepted"
    ||
    state==="Cleared"
  ){
    return "green";
  }


  if(
    state==="Declined"
    ||
    state==="Not Honoured"
  ){
    return "orange";
  }


  return "red";
}


function personCard(
  s
){

  return `

    <div
      class="person-card"
      onclick="
        showStudent(
          '${s.id}'
        )
      ">

      <div class="person-icon">
        ${initials(s.name)}
      </div>

      <div>

        <div class="person-title">
          ${s.name}
        </div>

        <div class="person-subtitle">
          ${s.id}
          ·
          ${s.dept}
        </div>

      </div>

      <div class="person-side">

        ${
          s.bestPackage
          ?
          `

            <div class="person-package">
              ₹${s.bestPackage}L
            </div>

              ${s.bestCompany}
            </div>
          `
          :

        }

function industryPersonCard(
  name
){

  const c =
    getIndustryByName(
      name
    );


  if(
    !c
  ){
    return "";
  }


  return `

    <div
      class="person-card"
      onclick="
        selectedIndustry='${c.id}';
        renderMiddle();
        renderLeft();
      ">

      <div class="person-icon">
        ${initials(c.name)}
      </div>

      <div>

        <div class="person-title">
          ${c.name}
        </div>

        <div class="person-subtitle">
          ${c.sector}
          ·
          ${c.relationship}
        </div>

      </div>

      <div class="person-side">
        ${statusBadge(c.status)}
      </div>

    </div>
  `;

}


function getIndustry(
  id
){

  return industries.find(
    x=>x.id===id
  );

}


function getIndustryByName(
  name
){

  return industries.find(
    x=>x.name===name
  );

}


function currentOffers(
  company
){

  return company.history
    .filter(
      h=>h.year==="2027"
    )
    .reduce(
      (
        sum,
        h
      )=>
        sum+h.offers,
      0
    );

}


function maxPackage(
  company
){

  return Math.max(
    ...company.history.map(
      h=>h.package
    )
  );

}


function statusColour(
  status
){

  if(
    status==="Completed"
  ){
    return "#16a34a";
  }


  if(
    status==="Ongoing"
  ){
    return "#2563eb";
  }


  if(
    status==="Awaiting Result"
  ){
    return "#d97706";
  }


  if(
    status==="Confirmed"
  ){
    return "#7c3aed";
  }


  return "#dc2626";
}


function salaryLabel(
  slab
){

  const map = {

    gt40:"Above ₹40 LPA",

    p30_40:"₹30–40 LPA",

    p20_30:"₹20–30 LPA",

    p10_20:"₹10–20 LPA",

    p6_10:"₹6–10 LPA",

    p4_6:"₹4–6 LPA",

    p3_4:"₹3–4 LPA"

  };


  return map[slab];

}


function packageMatches(
  value,
  slab
){

  if(
    slab==="gt40"
  ){
    return value>40;
  }


  if(
    slab==="p30_40"
  ){
    return value>=30 && value<=40;
  }


  if(
    slab==="p20_30"
  ){
    return value>=20 && value<30;
  }


  if(
    slab==="p10_20"
  ){
    return value>=10 && value<20;
  }


  if(
    slab==="p6_10"
  ){
    return value>=6 && value<10;
  }


  if(
    slab==="p4_6"
  ){
    return value>=4 && value<6;
  }


  if(
    slab==="p3_4"
  ){
    return value>=3 && value<4;
  }


  return false;
}


/* =========================================================
   MODAL / TOAST
   ========================================================= */

function closeModal(){

  document
    .getElementById(
      "detailModal"
    )
    .classList.remove(
      "open"
    );

}


function showToast(
  message
){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  setTimeout(
    ()=>
      toast.classList.remove(
        "show"
      ),
    2400
  );

}


document
  .getElementById(
    "detailModal"
  )
  .addEventListener(
    "click",
    event=>{

      if(
        event.target.id==="detailModal"
      ){
        closeModal();
      }

    }
  );


/* =========================================================
   MASTER RENDER
   ========================================================= */

function renderAll(){

  renderLeft();

  renderMiddle();

}


/* =========================================================
   INITIAL LOAD
   ========================================================= */

renderAll();

</script>
